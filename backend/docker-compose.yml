version: '3.8'

services:
  db:
    image: postgres:latest
    env_file: .env
    ports:
      - "5432:5432"
    container_name: evolve-db
    networks:
      - evolve-network

  redis:
    image: redis
    container_name: evolve-redis
    ports:
      - "6379:6379"
    networks:
      - evolve-network

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    container_name: evolve-app
    networks:
      - evolve-network

networks:
  evolve-network:
    driver: bridge
